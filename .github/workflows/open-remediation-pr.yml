name: Open Remediation PR

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pull Request via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const res = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: 'codemender/auto-remediation',
                base: 'main',
                title: '🤖 CodeMender: autonomous security remediation',
                body: `## 🤖 Autonomous remediation by CodeMender

CodeMender's CI/CD guardrail scanned \`routes/login.ts\` and found HIGH/CRITICAL findings.
This PR auto-remediates route vulnerabilities via automated security patches.

---
Full machine-readable report: the **\`codemender-report\`** artifact in workflow runs.`
              });
              console.log('Successfully created PR:', res.data.html_url);
            } catch (err) {
              console.error('Error creating PR:', err);
              throw err;
            }
